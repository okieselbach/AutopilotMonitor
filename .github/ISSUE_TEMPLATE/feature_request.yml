name: Feature request
description: Propose something Autopilot Monitor should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web portal
        - Agent (on device)
        - Analysis rules / diagnostics
        - MCP server / AI integration
        - Notifications / integrations
        - Reporting
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
