name: Workflow gates

# Four checks over the workflow files and their helper scripts:
#   * verify-pins -- every third-party action is referenced by a full commit SHA plus a
#                    version comment (stricter than zizmor's unpinned-uses audit).
#   * zizmor      -- static analysis of every workflow (permissions, credential
#                    persistence, template injection, ...). Configuration and the
#                    reasoned ignores live in zizmor.yml at the repository root; the
#                    same run is expected locally before a workflow change is committed.
#   * hosts       -- no workflow or .github/scripts helper spells out a host; every one
#                    comes from .github/scripts/Get-Endpoints.ps1, CI's member of the URL
#                    registry (the C#, web and MCP registries have guard tests of their own).
#   * packages    -- no workflow or helper fetches a package at a version the repository
#                    does not fix, in the forms zizmor's adhoc-packages audit does not see.
#
# Every third-party action must be referenced by a full commit SHA, never by a tag.
# Tags are mutable: whoever controls an action repository can repoint v4 at new code,
# and that code runs inside jobs that hold the code-signing identity, the storage
# credentials and a token that can push to main. A SHA is the only reference an
# upstream owner cannot change under us.
#
# Lives in its own workflow rather than in ci.yml: CI deliberately ignores changes to
# the other workflow files, so a guard placed there would stay silent for exactly the
# commits it needs to inspect. Dependabot's action-pin PRs are the main customer: they
# rewrite workflow files without anyone running zizmor locally.
#
# Like CI, this reports rather than blocks: main is deliberately unprotected, so a red
# run is a signal to act on, not a merge barrier. Making it binding means adding
# 'Verify action pins' as a required status check -- a branch-protection decision, not
# something this file can assert.
#
# The pins are not maintained by hand — .github/dependabot.yml opens a monthly grouped
# PR that rewrites both the SHA and the trailing version comment. The comment is
# therefore required too: it is what makes a pinned line reviewable. It names the exact
# release tag (# v7.0.1), never the floating major (# v7): a major tag moves with every
# upstream release, after which the comment no longer names the pinned commit and
# zizmor's ref-version-mismatch flags every line that carries it.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/scripts/**', '.github/dependabot.yml', 'zizmor.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', '.github/scripts/**', '.github/dependabot.yml', 'zizmor.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pins:
    name: Verify action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every third-party action is pinned to a SHA
        run: |
          set -uo pipefail
          failed=0
          while IFS=: read -r file line ref; do
            # Reusable workflows from this repository (workspace-relative ./ or the
            # self-repository form $/) move with the commit that calls them, so there is
            # nothing to pin.
            case "$ref" in ./*|\$/*) continue ;; esac

            if [[ "$ref" =~ ^[^@]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$) ]]; then
              printf 'ok  %s:%s  %s\n' "$file" "$line" "$ref"
              continue
            fi

            if [[ "$ref" =~ ^[^@]+@[0-9a-f]{40}[[:space:]]*$ ]]; then
              echo "::error file=$file,line=$line::Pinned but the version comment is missing: '$ref'. Write 'owner/action@<sha> # vX.Y.Z' so the line stays reviewable."
            elif [[ "$ref" =~ ^[^@]+@[0-9a-f]{40}[[:space:]]+# ]]; then
              echo "::error file=$file,line=$line::The version comment must name the exact release tag the SHA resolves to ('# vX.Y.Z'), not a floating major: '$ref'. Find it with: gh api repos/<owner>/<action>/git/matching-refs/tags/vN"
            else
              echo "::error file=$file,line=$line::Action '$ref' is not pinned to a commit SHA. Tags are mutable -- resolve it with: gh api repos/<owner>/<action>/git/ref/tags/<tag>"
            fi
            failed=1
          # -H is load-bearing: with a single matching file grep omits the name, the
          # fields shift by one and every diagnostic points at nothing.
          done < <(grep -nHE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml \
                   | sed -E 's/^([^:]+):([0-9]+):[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*/\1:\2:/')

          if [ "$failed" -ne 0 ]; then
            echo "::error::Unpinned action references found -- fix them before this reaches main."
            exit 1
          fi
          echo "All action references are pinned to commit SHAs."

  zizmor:
    name: zizmor audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload: findings land in the Code scanning tab next to CodeQL
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor itself is version-pinned like every other tool here; bump it together with
      # the local install so the gate and the pre-commit run agree on the finding set.
      # Informational findings (template expansion of our own step outputs in pwsh) are
      # visible locally but do not fail the gate.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          min-severity: low

  hosts:
    name: Hosts only from the endpoint registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The enforced host list is derived from the registry itself, plus every Azure storage,
      # App Service and autopilotmonitor.com host, so it cannot fall behind a new entry.
      - name: No host literal outside .github/scripts/Get-Endpoints.ps1
        shell: pwsh
        run: ./.github/scripts/Assert-HostsFromRegistry.ps1

  packages:
    name: Packages only at a version the repository fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm packages come from a committed lockfile via npm ci; zizmor's adhoc-packages flags
      # `npm install <pkg>` (also yarn, pnpm, gem), but not the forms below, which also fetch at
      # run time:
      #   * npx / npm exec without --no: in CI they install a missing package without asking.
      #     The -- is load-bearing: without it npx hands the tool's own flags to npm.
      #   * a .NET tool without an exact --version, a PowerShell module without -RequiredVersion.
      # Other package managers (pip, cargo, dlx runners) are covered by neither check.
      - name: No package fetched at a version the repository does not fix
        run: |
          set -uo pipefail
          failed=0
          fail() { echo "::error file=$1,line=$2::$3"; failed=1; }
          while IFS=: read -r file line text; do
            # YAML, shell and PowerShell comments alike start the line with #.
            [[ "$text" =~ ^[[:space:]]*# ]] && continue

            if [[ "$text" =~ (^|[^[:alnum:]_./-])(npx|npm[[:space:]]+(exec|x))([[:space:]]|$) ]] &&
               ! [[ "$text" =~ (npx|npm[[:space:]]+(exec|x))[[:space:]]+--no[[:space:]]+--([[:space:]]|$) ]]; then
              fail "$file" "$line" "Write 'npx --no -- <tool>' (or 'npm exec --no -- <tool>'): without --no a missing package is fetched from the registry, without -- the tool's flags go to npm."
            fi

            if [[ "$text" =~ dotnet[[:space:]]+tool[[:space:]]+(install|update) ]] &&
               ! [[ "$text" =~ --version[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+([^0-9.*]|$) ]]; then
              fail "$file" "$line" "Give the .NET tool an exact --version X.Y.Z on the same line; a range or a missing version resolves at run time."
            fi

            if [[ "$text" =~ Install-(Module|PSResource)[[:space:]] ]] &&
               ! [[ "$text" =~ -RequiredVersion[[:space:]]+[^[:space:]] || "$text" =~ -Version[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+([^0-9.*]|$) ]]; then
              fail "$file" "$line" "Give the PowerShell module an exact version on the same line, -RequiredVersion for Install-Module, -Version X.Y.Z for Install-PSResource; -MinimumVersion resolves at run time."
            fi
          # -H is load-bearing, as in verify-pins: with a single matching file grep omits the name.
          done < <(grep -nHE 'npx|npm[[:space:]]+(exec|x)([[:space:]]|$)|dotnet[[:space:]]+tool[[:space:]]+(install|update)|Install-(Module|PSResource)' \
                   .github/workflows/*.yml .github/scripts/*.ps1)

          if [ "$failed" -ne 0 ]; then
            echo "::error::Packages fetched at a version the repository does not fix -- fix them before this reaches main."
            exit 1
          fi
          echo "Every package the workflows and their helpers fetch has a version the repository fixes."
