name: Validate & Combine Rules
on:
  push:
    branches: [main, dev]
    paths:
      - 'rules/gather/**'
      - 'rules/analyze/**'
      - 'rules/ime-log-patterns/**'
      - 'rules/schema/**'
      - 'rules/scripts/**'
      - 'rules/guardrails.json'
  pull_request:
    paths:
      - 'rules/gather/**'
      - 'rules/analyze/**'
      - 'rules/ime-log-patterns/**'
      - 'rules/schema/**'
      - 'rules/scripts/**'
      - 'rules/guardrails.json'

jobs:
  validate-and-combine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate Gather Rules
        run: |
          for f in rules/gather/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/gather-rule.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Validate Analyze Rules
        run: |
          for f in rules/analyze/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/analyze-rule.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Validate IME Log Patterns
        run: |
          for f in rules/ime-log-patterns/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/ime-log-pattern.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Combine rules into dist/
        run: node rules/scripts/combine.js

      - name: Commit generated outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate rules/dist + generated TS from individual files"
          # combine.js writes THREE outputs; committing only dist/ would silently discard
          # the two generated TS modules and leave the guardrails-in-sync CI check red.
          file_pattern: "rules/dist/* src/Web/autopilot-monitor-web/utils/guardrails.generated.ts src/McpServer/autopilot-monitor-mcp/src/rule-authoring.generated.ts"
