name: Validate & Combine Rules
on:
  push:
    branches: [main, dev]
    paths:
      - 'rules/gather/**'
      - 'rules/analyze/**'
      - 'rules/ime-log-patterns/**'
      - 'rules/schema/**'
      - 'rules/scripts/**'
      - 'rules/guardrails.json'
  pull_request:
    paths:
      - 'rules/gather/**'
      - 'rules/analyze/**'
      - 'rules/ime-log-patterns/**'
      - 'rules/schema/**'
      - 'rules/scripts/**'
      - 'rules/guardrails.json'

jobs:
  validate-and-combine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate Gather Rules
        run: |
          for f in rules/gather/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/gather-rule.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Validate Analyze Rules
        run: |
          for f in rules/analyze/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/analyze-rule.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      - name: Validate IME Log Patterns
        run: |
          for f in rules/ime-log-patterns/*.json; do
            echo "Validating $f..."
            ajv validate -s rules/schema/ime-log-pattern.schema.json -d "$f" --spec=draft2020 -c ajv-formats
          done

      # guardrails.json values are baked verbatim into generated TypeScript that is
      # auto-committed to main and shipped to the portal - the schema forbids control
      # and line-terminator characters so a "data" PR can never become code.
      - name: Validate Guardrails
        run: ajv validate -s rules/schema/guardrails.schema.json -d rules/guardrails.json --spec=draft2020 -c ajv-formats

      - name: Combine rules into dist/
        run: node rules/scripts/combine.js

      # Plain git instead of a third-party action: this step runs with contents:write on
      # main, so no code we do not control gets to push. Checkout leaves the job's
      # GITHUB_TOKEN in the remote credential helper, which is all `git push` needs.
      # NOTE: combine.js writes THREE outputs; committing only dist/ would silently discard
      # the two generated TS modules and leave the guardrails-in-sync CI check red.
      - name: Commit generated outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rules/dist/ \
            src/Web/autopilot-monitor-web/utils/guardrails.generated.ts \
            src/McpServer/autopilot-monitor-mcp/src/rule-authoring.generated.ts
          if git diff --cached --quiet; then
            echo "Generated outputs unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore: regenerate rules/dist + generated TS from individual files"
          git push origin HEAD:main
