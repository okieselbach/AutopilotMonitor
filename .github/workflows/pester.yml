name: Pester (Bootstrap scripts)

# Pull-request view of the bootstrap script gates. Like ci.yml it reports rather than
# blocks the merge button.
#
# There is deliberately no push trigger: publish-scripts.yml runs the very same
# reusable gate workflow on every push to main and blocks the upload to the download
# alias on it. A push trigger here would only duplicate that run, with no consequence.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/Bootstrap/**'
      - 'scripts/CustomerSetup/**'
      - '.github/scripts/Publish-BootstrapScripts.ps1'
      - '.github/scripts/Invoke-BootstrapSystemPass.ps1'
      - '.github/scripts/Test-BootstrapAttacker.ps1'
      - '.github/workflows/bootstrap-script-gates.yml'
      # The integration tests run the generated OOBE script and the MSI's command line.
      - 'src/Backend/AutopilotMonitor.Functions.Tests/TestData/oobe-bootstrap-golden.ps1'
      - 'src/Agent/AutopilotMonitor.BootstrapMsi/Package.wxs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # $/ is the self-repository form: this repository at the running commit.
  gates:
    uses: $/.github/workflows/bootstrap-script-gates.yml
