name: Bootstrap script gates

# The bootstrap script gates on every change to what they execute or read, on pull requests
# and on pushes to main, independent of any publish. Like ci.yml it reports rather than
# blocks the merge button; what blocks is the gates job each publisher runs in front of its
# upload.
#
# Both path lists are the gates' complete inputs and stay identical. They cover every push
# path of publish-scripts.yml, which leaves the check of a [skip publish] push to this run.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/Bootstrap/**'
      - 'scripts/CustomerSetup/**'
      - '.github/scripts/Publish-BootstrapScripts.ps1'
      - '.github/scripts/Get-Endpoints.ps1'
      - '.github/scripts/Invoke-BootstrapSystemPass.ps1'
      - '.github/scripts/Test-BootstrapAttacker.ps1'
      - '.github/workflows/bootstrap-script-gates.yml'
      - '.github/workflows/pester.yml'
      # The integration tests run the generated OOBE script and the MSI's custom action; the
      # contract tests also read the MSI build.
      - 'src/Backend/AutopilotMonitor.Functions.Tests/TestData/oobe-bootstrap-golden.ps1'
      - 'src/Agent/AutopilotMonitor.BootstrapMsi/Package.wxs'
      - '.github/workflows/build-msi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/Bootstrap/**'
      - 'scripts/CustomerSetup/**'
      - '.github/scripts/Publish-BootstrapScripts.ps1'
      - '.github/scripts/Get-Endpoints.ps1'
      - '.github/scripts/Invoke-BootstrapSystemPass.ps1'
      - '.github/scripts/Test-BootstrapAttacker.ps1'
      - '.github/workflows/bootstrap-script-gates.yml'
      - '.github/workflows/pester.yml'
      - 'src/Backend/AutopilotMonitor.Functions.Tests/TestData/oobe-bootstrap-golden.ps1'
      - 'src/Agent/AutopilotMonitor.BootstrapMsi/Package.wxs'
      - '.github/workflows/build-msi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # $/ is the self-repository form: this repository at the running commit.
  gates:
    uses: $/.github/workflows/bootstrap-script-gates.yml
