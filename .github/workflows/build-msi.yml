name: Build & Publish Bootstrap MSI

# Thin MDM LOB delivery vehicle for WDP (Autopilot v2) — see
# src/Agent/AutopilotMonitor.BootstrapMsi/Package.wxs. The MSI is packaging only: it
# carries the SAME stage-1 loader that is assigned directly in Intune, so it is rebuilt
# rarely — only when that loader or the WiX package changes. Version lives in Package.wxs
# — bump it there before dispatching so Intune LOB update detection sees a new
# ProductVersion.

on:
  workflow_dispatch:
    inputs:
      upload_blob:
        description: 'Upload to blob (customer-facing through the download alias)'
        required: true
        type: boolean
        default: true

# Every job states its own permissions. This default is what the build job runs with: wix is
# third-party code and must never hold more than a read-only token.
permissions:
  contents: read

env:
  MSI_PROJECT_DIR: src/Agent/AutopilotMonitor.BootstrapMsi
  RUNNER_SCRIPT: scripts/Bootstrap/Start-AutopilotMonitor.ps1
  STABLE_MSI: AutopilotMonitor-Bootstrap.msi
  # Authenticode via Azure Key Vault; identity and vault come from repository variables, the
  # timestamp server (CODE_SIGN_TIMESTAMP_URL) from the endpoint registry like every host here.
  # CODE_SIGN_EXPECTED_SUBJECT is optional and pins the publisher in the verify steps.
  CODE_SIGN_CLIENT_ID: ${{ vars.CODE_SIGN_CLIENT_ID }}
  CODE_SIGN_CERTIFICATE_NAME: ${{ vars.CODE_SIGN_CERTIFICATE_NAME }}
  CODE_SIGN_KEY_VAULT_URL: ${{ vars.CODE_SIGN_KEY_VAULT_URL }}
  CODE_SIGN_EXPECTED_SUBJECT: ${{ vars.CODE_SIGN_EXPECTED_SUBJECT }}

jobs:
  # Signs the loader BEFORE the build: wix embeds the file as it finds it, so a loader signed
  # afterwards would leave the copy inside the MSI unsigned. Devices under an AllSigned policy
  # need the embedded loader to carry a signature of its own.
  #
  # Trust zone: only this repository's scripts, pinned actions and the pinned signing tool run
  # here. No `environment:` yet: the code-signing credential is still bound to the ref, and a
  # job carries exactly one OIDC subject.
  sign-loader:
    name: Sign bootstrap loader
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # code-signing login

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every host in this workflow comes from the one endpoint registry.
      - name: Load endpoints
        shell: pwsh
        run: ./.github/scripts/Get-Endpoints.ps1 -ExportToGitHubEnv

      # The loader executes as SYSTEM on every enrolling device — a parse error or
      # non-ASCII mojibake (PS 5.1 codepage roulette) must fail the build, not the fleet.
      # bootstrap-script-gates.yml runs the same checks plus Pester on pushes; this job
      # stands on its own because it can be dispatched at any time.
      - name: Validate runner script (parse + ASCII-only)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $env:RUNNER_SCRIPT), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          if ((Get-Content $env:RUNNER_SCRIPT -Raw) -match '[^\x00-\x7F]') {
            Write-Error "Runner script contains non-ASCII characters"
            exit 1
          }
          Write-Host "Runner script parse + ASCII check passed"

      # Every published MSI is signed; a missing variable stops the run before the build.
      - name: Check code-signing configuration
        shell: pwsh
        run: |
          foreach ($name in 'CODE_SIGN_CLIENT_ID', 'CODE_SIGN_CERTIFICATE_NAME', 'CODE_SIGN_KEY_VAULT_URL') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Repository variable $name is not set. Every published MSI must be Authenticode-signed."
            }
          }

      - name: Login to Azure (code-signing identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.CODE_SIGN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire Key Vault token for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = az account get-access-token --scope https://vault.azure.net/.default --query accessToken --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire a Key Vault token for the code-signing identity."
          }
          Write-Host "::add-mask::$token"
          "CODE_SIGN_AKV_ACCESS_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Version pinned; roll-forward because the tool targets an older runtime than the SDK.
      - name: Install AzureSignTool
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet tool install --no-cache --global AzureSignTool --version 7.0.1

      # A missing timestamp fails the run: without it the signature dies with the certificate.
      - name: Sign bootstrap loader (Authenticode)
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          $ErrorActionPreference = 'Stop'
          & azuresigntool.exe sign --verbose `
            --azure-key-vault-url "$env:CODE_SIGN_KEY_VAULT_URL" `
            --azure-key-vault-accesstoken "$env:CODE_SIGN_AKV_ACCESS_TOKEN" `
            --azure-key-vault-certificate "$env:CODE_SIGN_CERTIFICATE_NAME" `
            --timestamp-rfc3161 "$env:CODE_SIGN_TIMESTAMP_URL" `
            --file-digest sha256 `
            --description 'Autopilot Monitor bootstrap runner' `
            --description-url $env:WWW_BASE_URL `
            $env:RUNNER_SCRIPT
          if ($LASTEXITCODE -ne 0) { throw "azuresigntool failed with exit code $LASTEXITCODE" }

          $sig = Get-AuthenticodeSignature -FilePath $env:RUNNER_SCRIPT
          if ($sig.Status -ne 'Valid') { throw "Signature on $env:RUNNER_SCRIPT is '$($sig.Status)', expected 'Valid'." }
          if (-not $sig.TimeStamperCertificate) { throw "Signature on $env:RUNNER_SCRIPT carries no timestamp." }
          if ($env:CODE_SIGN_EXPECTED_SUBJECT -and $sig.SignerCertificate.Subject -notlike $env:CODE_SIGN_EXPECTED_SUBJECT) {
            throw "$env:RUNNER_SCRIPT was signed by '$($sig.SignerCertificate.Subject)', expected '$env:CODE_SIGN_EXPECTED_SUBJECT'."
          }
          Write-Host "$env:RUNNER_SCRIPT : Valid, timestamped, signer $($sig.SignerCertificate.Subject.Split(',')[0])"

      - name: Upload signed loader
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-loader-signed
          path: ${{ env.RUNNER_SCRIPT }}
          if-no-files-found: error
          retention-days: 1

  # Build zone: no login, no secret, no id-token. Its only output is the artifact; the
  # release job treats that as data and never builds.
  build:
    name: Build MSI
    needs: sign-loader
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed loader
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootstrap-loader-signed
          path: ${{ runner.temp }}/loader

      # The signed copy replaces the checkout's unsigned one before wix embeds it.
      - name: Put the signed loader in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'loader/Start-AutopilotMonitor.ps1') -Destination $env:RUNNER_SCRIPT -Force
          $sig = Get-AuthenticodeSignature -FilePath $env:RUNNER_SCRIPT
          if ($sig.Status -ne 'Valid') { throw "Loader to embed is '$($sig.Status)', expected 'Valid'." }
          Write-Host "Embedding the signed loader ($((Get-Item $env:RUNNER_SCRIPT).Length) bytes)"

      # Exact version, not a "5.*" range: wix writes the bytes of the MSI that customers
      # install, so a compromised or simply broken point release must not flow into a build
      # unnoticed. Bumping is a reviewed commit.
      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          # wix resolves File/@Source relative to the working directory, not the wxs —
          # build from inside the project dir (same as the local build documented in the wxs).
          $out = Join-Path (Get-Location) $env:STABLE_MSI
          Push-Location $env:MSI_PROJECT_DIR
          wix build Package.wxs -arch x64 -o $out
          Pop-Location
          if (-not (Test-Path $env:STABLE_MSI)) { Write-Error "wix build produced no MSI"; exit 1 }
          Write-Host "Built $env:STABLE_MSI ($([math]::Round((Get-Item $env:STABLE_MSI).Length / 1KB)) KB)"

      - name: Upload unsigned MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-msi-unsigned
          path: ${{ env.STABLE_MSI }}
          if-no-files-found: error
          retention-days: 1

  # Trust zone: signs, verifies and publishes the MSI as data; never builds. No
  # `environment:` yet, for the same reason as sign-loader.
  release:
    name: Sign and publish MSI
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # code-signing and storage logins, keyless Sigstore signing
      attestations: write  # store the provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load endpoints
        shell: pwsh
        run: ./.github/scripts/Get-Endpoints.ps1 -ExportToGitHubEnv

      # Read from this job's own checkout, never handed over by the build job.
      - name: Read MSI version from Package.wxs
        id: version
        shell: pwsh
        run: |
          $wxs = Get-Content "$env:MSI_PROJECT_DIR/Package.wxs" -Raw
          if ($wxs -notmatch 'Version="(\d+\.\d+\.\d+)"') {
            Write-Error "Could not parse Version from Package.wxs"
            exit 1
          }
          $version = $Matches[1]
          Write-Host "MSI version (from Package.wxs): $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download unsigned MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootstrap-msi-unsigned
          path: ${{ runner.temp }}/msi

      # Only the expected file leaves the download folder.
      - name: Take the MSI from the build
        shell: pwsh
        run: Copy-Item -Path (Join-Path $env:RUNNER_TEMP "msi/$env:STABLE_MSI") -Destination $env:STABLE_MSI -ErrorAction Stop

      # Logs in FIRST and only to fetch the Key Vault token: azure/login sets the default az
      # account, so the storage login below has to be the last one.
      - name: Login to Azure (code-signing identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.CODE_SIGN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire Key Vault token for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = az account get-access-token --scope https://vault.azure.net/.default --query accessToken --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire a Key Vault token for the code-signing identity."
          }
          Write-Host "::add-mask::$token"
          "CODE_SIGN_AKV_ACCESS_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The blob upload below is authorized by this federated identity, not by a SAS.
      - name: Login to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Version pinned; roll-forward because the tool targets an older runtime than the SDK.
      - name: Install AzureSignTool
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet tool install --no-cache --global AzureSignTool --version 7.0.1

      # Signing rewrites the MSI, so it runs before the hash and the upload. A missing
      # timestamp fails the run: without it the signature dies with the certificate.
      - name: Sign MSI (Authenticode)
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          $ErrorActionPreference = 'Stop'
          & azuresigntool.exe sign --verbose `
            --azure-key-vault-url "$env:CODE_SIGN_KEY_VAULT_URL" `
            --azure-key-vault-accesstoken "$env:CODE_SIGN_AKV_ACCESS_TOKEN" `
            --azure-key-vault-certificate "$env:CODE_SIGN_CERTIFICATE_NAME" `
            --timestamp-rfc3161 "$env:CODE_SIGN_TIMESTAMP_URL" `
            --file-digest sha256 `
            --description 'Autopilot Monitor Bootstrap' `
            --description-url $env:WWW_BASE_URL `
            $env:STABLE_MSI
          if ($LASTEXITCODE -ne 0) { throw "azuresigntool failed with exit code $LASTEXITCODE" }

          # The loader was verified in sign-loader; here the MSI, before anything is published.
          $sig = Get-AuthenticodeSignature -FilePath $env:STABLE_MSI
          if ($sig.Status -ne 'Valid') { throw "Signature on $env:STABLE_MSI is '$($sig.Status)', expected 'Valid'." }
          if (-not $sig.TimeStamperCertificate) { throw "Signature on $env:STABLE_MSI carries no timestamp." }
          if ($env:CODE_SIGN_EXPECTED_SUBJECT -and $sig.SignerCertificate.Subject -notlike $env:CODE_SIGN_EXPECTED_SUBJECT) {
            throw "$env:STABLE_MSI was signed by '$($sig.SignerCertificate.Subject)', expected '$env:CODE_SIGN_EXPECTED_SUBJECT'."
          }
          Write-Host "$env:STABLE_MSI : Valid, timestamped, signer $($sig.SignerCertificate.Subject.Split(',')[0])"

          Write-Host "SHA-256: $((Get-FileHash $env:STABLE_MSI -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Upload to Azure Blob Storage
        if: inputs.upload_blob
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $containerUrl = $env:AGENT_CONTAINER_URL
          $authHeaders = & ./.github/scripts/Get-StorageAuthHeaders.ps1
          $version = $env:MSI_VERSION

          # Same Send-Blob contract as build-agent.yml: no-cache on every blob because the
          # stable name rotates in place behind the download alias. No legacy mirror — the
          # MSI channel never existed on the legacy account.
          function Send-Blob {
            param([string]$Local, [string]$BlobName)
            $bytes = [System.IO.File]::ReadAllBytes($Local)
            $headers = @{
              "x-ms-blob-type" = "BlockBlob"
              "Content-Type" = "application/octet-stream"
              "x-ms-blob-cache-control" = "no-cache"
            }
            $md5 = [System.Security.Cryptography.MD5]::Create()
            $headers["Content-MD5"] = [Convert]::ToBase64String($md5.ComputeHash($bytes))
            $md5.Dispose()
            Write-Host "Uploading $BlobName ($([math]::Round($bytes.Length / 1KB)) KB)..."
            Invoke-RestMethod -Uri "$containerUrl/$BlobName" -Method Put -Headers ($authHeaders + $headers) -Body $bytes
            Write-Host "  uploaded $BlobName"
          }

          # Versioned copy for provenance/rollback + stable customer-facing name.
          Send-Blob -Local $env:STABLE_MSI -BlobName "AutopilotMonitor-Bootstrap-v$version.msi"
          Send-Blob -Local $env:STABLE_MSI -BlobName $env:STABLE_MSI

      # E2E: the Front Door route /agent/* must serve the fresh bytes on the public alias.
      - name: Verify download alias serves the MSI
        if: inputs.upload_blob
        shell: pwsh
        run: |
          $localSize = (Get-Item $env:STABLE_MSI).Length
          $resp = Invoke-WebRequest -Uri "$env:DOWNLOAD_ALIAS_URL/$env:STABLE_MSI" -Method Head -UseBasicParsing
          if ($resp.StatusCode -ne 200) { Write-Error "Alias HEAD returned $($resp.StatusCode)"; exit 1 }
          $remoteSize = [long]$resp.Headers['Content-Length'][0]
          if ($remoteSize -ne $localSize) {
            Write-Error "Size mismatch: alias serves $remoteSize bytes, local MSI is $localSize bytes"
            exit 1
          }
          Write-Host "Alias verified: $env:DOWNLOAD_ALIAS_URL/$env:STABLE_MSI ($remoteSize bytes)"

      # Sigstore keyless provenance, same as the agent ZIP; covers the signed bytes. Skipped
      # on runs that publish nothing -- no log entry for bytes nobody receives. Verify:
      # gh attestation verify AutopilotMonitor-Bootstrap.msi --repo okieselbach/AutopilotMonitor
      - name: Attest build provenance (MSI)
        if: inputs.upload_blob
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.STABLE_MSI }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AutopilotMonitor-Bootstrap-v${{ steps.version.outputs.version }}
          path: ${{ env.STABLE_MSI }}
